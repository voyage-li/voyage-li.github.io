<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>voyage-li</title>
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      background: radial-gradient(circle at 50% 45%, #161b22 0%, #0d1117 62%);
      background-color: #0d1117;
    }

    .avatar {
      position: relative;
      width: min(60vmin, 320px);
      aspect-ratio: 1;
      border-radius: 50%;
      animation: avatar-spin 30s linear infinite;
      will-change: transform;
      box-shadow:
        0 24px 60px rgba(1, 4, 9, 0.65),
        0 0 48px rgba(88, 166, 255, 0.12);
    }

    .avatar::before {
      content: "";
      position: absolute;
      inset: -5px;
      border: 1px solid rgba(240, 246, 252, 0.12);
      border-top-color: rgba(88, 166, 255, 0.7);
      border-radius: 50%;
      pointer-events: none;
    }

    .avatar img {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    @keyframes avatar-spin {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .avatar {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div class="avatar">
    <img
      src="https://github.com/voyage-li.png?size=460"
      alt="voyage-li 的 GitHub 头像"
      width="460"
      height="460"
      decoding="async"
    >
  </div>
</body>
</html>
